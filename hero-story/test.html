<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero story — test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050505;color:#D9D9D9;font-family:'Inter',system-ui,sans-serif}
  #track{position:relative;height:560vh}
  #stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;--accent:#E4232B;--glow:rgba(228,35,43,.5)}
  #configurateur{min-height:100vh;display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-size:28px;color:#6c7075}
</style>
</head>
<body>
<div id="track"><div id="stage"></div></div>
<div id="configurateur">[ configurateur ]</div>
<script>
  // <base href="../"> makes asset paths resolve from the site root, as on the site
  const s = document.createElement('script');
  s.src = 'hero-story/hero-story.js';
  s.onload = () => { EcrinStory.mount(document.getElementById('stage'), window); setTimeout(EcrinStory.start, 300); };
  document.head.appendChild(s);
</script>
</body>
</html>
